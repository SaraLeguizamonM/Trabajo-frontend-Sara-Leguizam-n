<section class="form-container">
    <div class="form-group">
        <label for="tipo">Tipo de informe</label>
        <select id="tipo">
            <option value="tipo1">Informe de notas</option>
            <option value="tipo2">Informe de asistencia</option>
        </select>
    </div>
    <div class="form-group">
        <label for="grado">Grado</label>
        <select id="grado">
            <option value="grado10">9</option>
            <option value="grado11">10</option>
            <option value="grado12">11</option>
        </select>
    </div>
    <div class="form-group">
        <label for="grupo">Grupo</label>
        <select id="grupo">
            <option value="grupoA">A</option>
            <option value="grupoB">B</option>
            <option value="grupoC">C</option>
        </select>
    </div>
    <div class="form-group">
        <label for="periodo">Periodo</label>
        <select id="periodo">
            <option value="periodo1">1</option>
            <option value="periodo2">2</option>
            <option value="periodo3">3</option>
        </select>
    </div>
    <div class="form-group">
        <label for="codigo">Código</label>
        <input type="text" id="codigo" placeholder="">
    </div>
    <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="">
    </div>
</section>
