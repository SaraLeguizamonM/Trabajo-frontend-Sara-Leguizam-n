<section>

    <div class = 'filtro'>
        <div class = 'filSeleccion'>
            <label for = 'grado'>Grado</label>
            <select class = 'filtroInternoG' id = 'grado' [(ngModel)]="gradoFiltro">
                <option value="">Todos</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
            </select>
        </div>

        <div class = 'filSeleccion'>
            <label for = 'grupo'>Grupo</label>
            <select class = 'filtroInternoG' id = 'grupo' [(ngModel)]="grupoFiltro">
                <option value="">Todos</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>

        <div class = 'buttons'>
            <button class = 'btnBuscar' (click)="filtrarGrupos()">Buscar</button>
            <a class = 'linkLimpiar' (click)="limpiarFiltros()">Limpiar</a>
        </div>
    </div>

    <div class = 'tablas'>
        <div class = 'resultados'>
            <h2>Resultados</h2>

            <div class="nResult">
            <label for = 'mostrar'>Mostrar</label>
                <select class = 'resultados' id = 'mostrar'>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            </div>
        </div>

        <div>
            <table class = 'tabla'>
                <thead>
                    <th>Grado</th>
                    <th>Grupo</th>
                    <th>Jornada</th>
                    <th>Número de estudiantes</th>
                    <th>Acciones</th>
                </thead>

                <tbody>
                    <tr *ngFor="let grupo of filteredGrupos" [ngClass]="{'color1': filteredGrupos.indexOf(grupo) % 2 !== 0}">
                        <td>{{grupo.grado}}</td>
                        <td>{{grupo.grupo}}</td>
                        <td>{{grupo.jornada}}</td>
                        <td>{{grupo.numeroEstudiantes}}</td>
                        <td>
                            <div class = 'buttonsIcons'>
                                <button class = 'iconImg'>
                                    <img [src]="imgQuipuxE" alt="quipuxE">
                                </button>
                                <button class = 'iconImg'>
                                    <img [src]="imgQuipuxB" alt="quipuxB">
                                </button>
                            </div>
                            
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class = 'mostarNum'>
            <h3>Mostrando {{filteredGrupos.length}} de {{grupos.length}} registros</h3>

            <div class = 'num'>
            <button>Primero</button> 
            <button>1</button> 
            <button>Ultimo</button> 
            </div>
        
        </div>

    </div>

</section>
