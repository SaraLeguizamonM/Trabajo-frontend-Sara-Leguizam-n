<section class="form-container">
    <div class="form-group">
        <label for="codigo">Código</label>
        <input id="codigo" type="text" placeholder="Ingrese el código">
    </div>

    <div class="form-group">
        <label for="grado">Grado</label>
        <select id="grado">
            <option value="">Seleccione</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nombre">Nombre del grupo</label>
        <input id="nombre" type="text" placeholder="Ingrese el nombre del grupo">
    </div>

    <div class="form-group">
        <label for="jornada">Jornada</label>
        <select id="jornada">
            <option value="">Seleccione</option>
            <option value="M">Mañana</option>
            <option value="T">Tarde</option>
        </select>
    </div>

    <div class="buttons">
        <button class="btnCancelar" (click)="onCancel()">Cancelar</button>
        <button class="btnBuscar">Guardar</button>
    </div>
</section>
